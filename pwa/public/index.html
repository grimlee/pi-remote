<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pi Remote">
  <meta name="description" content="A resilient mobile client for your Pi Agent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/vendor/katex.css">
  <title>Pi Remote</title>
  <script src="/app.js" type="module" defer></script>
</head>
<body>
  <section id="loginView" class="login-view" hidden>
    <div class="login-card">
      <div class="logo">π</div>
      <h1>Pi Remote</h1>
      <p>连接你自己的 Pi Agent。所有模型、文件和工具都留在 Host。</p>
      <form id="loginForm">
        <label for="token">PWA 登录密钥</label>
        <input id="token" type="password" autocomplete="off" required placeholder="输入 Host 显示的登录密钥">
        <button type="submit">连接 Host</button>
      </form>
      <p id="loginError" class="error" role="alert"></p>
      <small>请通过可信的 HTTPS / Tailnet 地址访问。PWA 不需要 iOS 侧载签名。</small>
    </div>
  </section>
  <div id="appView" class="shell" hidden>
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="工作区与会话">
      <div class="side-title"><div class="brand"><span class="logo-small">π</span> Pi Remote</div>
        <button id="closeSidebar" class="ghost mobile-only" aria-label="关闭会话列表">✕</button></div>
      <div class="side-subtitle">工作区与会话</div>
      <label for="sessionSearch" class="visually-hidden">搜索会话</label>
      <input id="sessionSearch" class="session-search" type="search" placeholder="搜索会话、工作区或模型…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="sessions" class="sessions" aria-label="会话列表"></div>
      <button id="refreshSessions" class="soft side-refresh">↻ 更新会话</button>
      <div class="side-footer">Pi 运行在电脑上，手机只负责交互。</div>
    </aside>
    <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="关闭会话导航" hidden></button>
    <main class="main">
      <header class="topbar">
        <button id="openSidebar" class="ghost mobile-only" aria-label="打开会话列表">☰</button>
        <div class="current-title">
          <strong id="sessionTitle">选择一个 Pi 会话</strong>
          <span id="sessionSub">Host 运行 Agent · iPhone 显示内容</span>
        </div>
        <button id="syncButton" class="ghost" title="同步会话" aria-label="同步会话">↻</button>
      </header>
      <div id="connection" class="connection" role="status">正在连接…</div>
      <div id="messages" class="messages">
        <div class="empty">选择左侧会话以开始，或从已有 Pi 会话继续工作。</div>
      </div>
      <button id="jumpLatest" class="jump-latest" type="button" hidden>↓ 回到最新</button>
      <form id="composer" class="composer">
        <textarea id="prompt" rows="2" aria-label="发送给 Pi 的消息" placeholder="输入消息…" disabled></textarea>
        <div class="composer-bar">
          <span id="activity" class="activity">等待选择会话</span>
          <div class="composer-buttons">
            <button id="stop" class="soft" type="button" disabled>停止</button>
            <button id="send" type="submit" disabled>发送 ↑</button>
          </div>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
