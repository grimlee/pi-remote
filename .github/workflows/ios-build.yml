name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pi Remote
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild \
            -project PiRemote.xcodeproj \
            -scheme PiRemote \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-tests.log

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf build-simulator
          xcodebuild \
            -project PiRemote.xcodeproj \
            -scheme PiRemote \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build-simulator" \
            build | tee xcodebuild-simulator.log

      - name: Package simulator app
        working-directory: ios
        run: |
          test -d build-simulator/PiRemote.app
          ditto -c -k --sequesterRsrc --keepParent build-simulator/PiRemote.app PiRemote-Simulator.zip

      - name: Build unsigned device app for sideloading
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf build-device
          xcodebuild \
            -project PiRemote.xcodeproj \
            -scheme PiRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build-device" \
            build | tee xcodebuild-device.log

      - name: Package sideload IPA
        working-directory: ios
        run: |
          test -d build-device/PiRemote.app
          rm -rf Payload PiRemote-Sideload.ipa
          mkdir Payload
          ditto build-device/PiRemote.app Payload/PiRemote.app
          zip -qry PiRemote-Sideload.ipa Payload
          rm -rf Payload
          test -s PiRemote-Sideload.ipa

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PiRemote-Simulator
          path: ios/PiRemote-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PiRemote-Sideload
          path: ios/PiRemote-Sideload.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/xcodebuild-tests.log
            ios/xcodebuild-simulator.log
            ios/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7
