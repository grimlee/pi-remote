name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pi Remote (Simulator)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild \
            -project PiRemote.xcodeproj \
            -scheme PiRemote \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build | tee xcodebuild.log

      - name: Package simulator app
        if: success()
        working-directory: ios
        run: |
          test -d build/PiRemote.app
          ditto -c -k --sequesterRsrc --keepParent build/PiRemote.app PiRemote-Simulator.zip

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PiRemote-Simulator
          path: ios/PiRemote-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
